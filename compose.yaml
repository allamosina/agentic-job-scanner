services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: monitor
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - monitor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 3s
      retries: 10
volumes:
  monitor_data:
