[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-monitor"
version = "0.1.0"
description = "Personal evidence-based vacancy monitoring and Telegram feedback"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "python-telegram-bot[job-queue]>=22,<23", "openai>=2,<3",
  "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[project.scripts]
job-monitor = "job_monitor.cli:run"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
